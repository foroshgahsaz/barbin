# نمونه Nginx برای Laravel روی Runflare / پاد
# root حتماً public باشد

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    # همه درخواست‌ها (از جمله /livewire/livewire.js و /up) به index.php بروند اگر فایل فیزیکی نیست
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;   # یا unix socket php-fpm
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}